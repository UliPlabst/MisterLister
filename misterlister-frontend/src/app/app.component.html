<nav>
  <div class="left">
    <a routerLink="/">
      <img src="logo.png" alt="Logo" class="logo" />
    </a>
    {{util.layout.title$ | async}}
  </div>
  <div class="buttons">
    @for(button of util.layout.buttons$ | async; track button) {
      <button mat-icon-button (click)="button.invoke($event)">
        <mat-icon>{{button.icon}}</mat-icon>
      </button>
    }
    <button mat-icon-button (click)="menu.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  </div>
</nav>
<app-info-toast-container></app-info-toast-container>
<div class="body">
  <app-slide-bar #menu [toggled]="menuExpanded" alignment="right">
    <div class="menu-item">
      @let user = util.user$ | async; 
      <div>
        @if(user == null) {
          No pseudonym selected
        } 
        @else {
          Current pseudonym: {{user}}
        }
      </div>
      <div>
        <button mat-flat-button  (click)="switchUser()">
          @if(user == null) {
            Set
          }
          @else {
            Switch
          }
        </button>
      </div>
    </div>
    <!-- <div class="menu-item">
      <div>
        Auto sync
      </div>
      <mat-slide-toggle [formControl]="autoSaveCtrl"></mat-slide-toggle>
    </div> -->
  </app-slide-bar>
  <router-outlet>
    
  </router-outlet>
</div>
<footer class="footer">
  <a [routerLink]="'/privacy'">
    Privacy Policy
  </a>
  <a [routerLink]="'/imprint'">
    Imprint
  </a>
  <a href="https://github.com/UliPlabst/misterlister">
    Github
  </a>
  <a [routerLink]="'/about'">
    About
  </a>
  <a [routerLink]="'/third-party'">
    Third-Party
  </a>
</footer>
