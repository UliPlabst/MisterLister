@if (data.title) {
  <h2 mat-dialog-title>{{ data.title }}</h2>
}
<mat-dialog-content class="mat-typography">
  <div class="qr-dialog">
    <div class="qr-container">
      <canvas #qrCanvas class="qr-canvas"></canvas>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  @if(data.buttons) {
    @for(button of data.buttons; track button) {
      <button mat-flat-button (click)="button.invoke($event)" [color]="button.color">
        @if(button.icon) {
          <mat-icon>{{button.icon}}</mat-icon>
        }
        {{button.label}}
      </button>
    }
    
  }
  <button mat-flat-button [mat-dialog-close]="null">
    Close
  </button>
</mat-dialog-actions>
